name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the repertoire …
        2. Tap …
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › About ORBT Chess
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 17 Pro, iOS 26.2
    validations:
      required: true
  - type: textarea
    id: pgn
    attributes:
      label: PGN, screenshots or crash log
      description: If a repertoire triggers it, the smallest PGN that does. Don't share a repertoire you'd rather keep private.
