[workspace]
resolver = "3"
members = ["ot-core", "ot-ffi", "uniffi-bindgen-swift"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
ot-core = { path = "ot-core" }
shakmaty = "0.30.2"
fsrs = "6.6.2"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
uniffi = "0.32.2"
insta = "1.49.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sha2 = "0.11.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "debuginfo"

# The snapshot tests run the real repertoires in testData/; unoptimized that is slow.
[profile.test]
opt-level = 2
