# The toolchain the core is checked with; rustup installs it (and the targets) on first use.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "wasm32-unknown-unknown",
]
profile = "minimal"
