org.gradle.jvmargs=-Xmx4g
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 no longer applies its Android plugins to a Kotlin Multiplatform module (core/ and app/
# are both). Until they are split (a KMP library with com.android.kotlin.multiplatform.library,
# the Android app its own module), keep AGP 8's behaviour; AGP 10 removes these.
android.builtInKotlin=false
android.newDsl=false
